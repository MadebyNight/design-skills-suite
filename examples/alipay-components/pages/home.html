<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>团团享租小程序首页原型</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/home.css">
</head>
<body>
  <main class="prototype-shell home-page" aria-label="团团享租小程序首页静态原型">
    <header class="home-top">
      <div class="home-search">
        <img class="home-search__icon" src="../assets/home/search.png" alt="">
        <span class="home-search__placeholder">搜索宝贝，开启租赁新生活</span>
        <span class="home-search__button">搜索</span>
      </div>
    </header>

    <section class="home-banner" aria-label="演唱会活动">
      <img src="../assets/home/banner-concert.png" alt="演唱会活动主视觉">
    </section>

    <nav class="home-nav" aria-label="商品分类">
      <div class="home-nav__item"><img class="home-nav__icon" src="../assets/home/nav-action-camera.png" alt=""><div class="home-nav__label">运动相机</div></div>
      <div class="home-nav__item"><img class="home-nav__icon" src="../assets/home/nav-photography.png" alt=""><div class="home-nav__label">相机摄影</div></div>
      <div class="home-nav__item"><img class="home-nav__icon" src="../assets/home/nav-concert.png" alt=""><div class="home-nav__label">演唱会神器</div></div>
      <div class="home-nav__item"><img class="home-nav__icon" src="../assets/home/nav-ccd.png" alt=""><div class="home-nav__label">CCD专区</div></div>
      <div class="home-nav__item"><img class="home-nav__icon" src="../assets/home/nav-subsidy.png" alt=""><div class="home-nav__label">超级补贴</div></div>
    </nav>

    <section class="home-tofu" aria-label="运营推荐">
      <div class="home-tofu__item"><img src="../assets/home/tofu-travel.png" alt="出游推荐"></div>
      <div class="home-tofu__item"><img src="../assets/home/tofu-computer.png" alt="电脑系列"></div>
      <div class="home-tofu__item"><img src="../assets/home/tofu-camera.png" alt="运动相机"></div>
    </section>

    <section class="home-waist-banner" aria-label="腰封广告">
      <img src="../assets/home/waist.png" alt="精选租赁推荐">
      <span class="home-waist-banner__count">1 / 1</span>
    </section>

    <nav class="home-category-tabs" aria-label="首页商品栏目">
      <div class="home-category-tabs__item is-active">爆款严选</div>
      <div class="home-category-tabs__item">电脑专区</div>
      <div class="home-category-tabs__item">智能穿戴</div>
      <div class="home-category-tabs__item">相机摄影</div>
    </nav>

    <section class="home-product-grid" aria-label="商品列表">
      <article class="home-product-card"><div class="home-product-card__image-wrap"><img class="home-product-card__image" src="../assets/home/product-osmo.jpg" alt="大疆 DJI Osmo Pocket 4"></div><div class="home-product-card__copy"><div class="home-product-card__kicker">大疆 DJI Osmo Pocket 4</div><div class="home-product-card__title"><span class="home-product-card__tag">全新</span>小胡神器，无限量 token plan</div><div class="home-product-card__price"><small>￥</small><strong>0</strong>.01<small>/天</small></div></div></article>
      <article class="home-product-card"><div class="home-product-card__image-wrap"><img class="home-product-card__image" src="../assets/home/product-vivo.jpg" alt="vivo X300 Ultra"></div><div class="home-product-card__copy"><div class="home-product-card__kicker">vivo X300 Ultra 长焦手机</div><div class="home-product-card__title"><span class="home-product-card__tag">99新</span>X300 Ultra</div><div class="home-product-card__price"><small>￥</small><strong>40</strong><small>/天</small></div></div></article>
      <article class="home-product-card"><div class="home-product-card__image-wrap"><img class="home-product-card__image" src="../assets/home/product-fuji.png" alt="富士 instax wide400"></div><div class="home-product-card__copy"><div class="home-product-card__kicker">富士 instax wide400 宽幅拍立得</div><div class="home-product-card__title"><span class="home-product-card__tag">99新</span>聚会欢乐氛围</div><div class="home-product-card__price"><small>￥</small><strong>2</strong>.50<small>/天</small></div></div></article>
      <article class="home-product-card"><div class="home-product-card__image-wrap"><img class="home-product-card__image" src="../assets/home/product-osmo.jpg" alt="大疆口袋相机"></div><div class="home-product-card__copy"><div class="home-product-card__kicker">大疆口袋相机 随手记录精彩</div><div class="home-product-card__title"><span class="home-product-card__tag">全新</span>轻巧便携稳定拍摄</div><div class="home-product-card__price"><small>￥</small><strong>0</strong>.01<small>/天</small></div></div></article>
    </section>
    <div class="home-end">没有更多啦，快去挑选商品吧～</div>

    <nav class="home-tabbar" aria-label="底部导航">
      <div class="home-tabbar__item is-active"><img class="home-tabbar__icon" src="../assets/home/home_b.png" alt=""><div>租物</div></div>
      <div class="home-tabbar__item"><img class="home-tabbar__icon" src="../assets/home/classify.png" alt=""><div>分类</div></div>
      <div class="home-tabbar__item"><img class="home-tabbar__icon" src="../assets/home/mine.png" alt=""><div>我的</div></div>
    </nav>
  </main>
</body>
</html>
