<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>演唱会落地页原型</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/landing.css">
</head>
<body>
  <main class="prototype-shell lp-page" aria-label="演唱会落地页静态原型">
    <section class="lp-hero"><img class="lp-cover-image" src="../assets/landing/hero.png" alt="演唱会租赁活动"></section>
    <div class="lp-spacer" aria-hidden="true"></div>
    <section class="lp-coupons" aria-label="活动优惠券">
      <article class="lp-coupon"><div class="lp-coupon-value"><div class="lp-coupon-amount"><small>¥</small>0.5</div><div class="lp-coupon-note">满1元可用</div></div><div class="lp-coupon-copy"><div class="lp-coupon-title">测试0806</div><div class="lp-coupon-action">立即领取</div></div></article>
      <article class="lp-coupon"><div class="lp-coupon-value"><div class="lp-coupon-amount"><small>¥</small>99.9</div><div class="lp-coupon-note">满100元可用</div></div><div class="lp-coupon-copy"><div class="lp-coupon-title">测试0817</div><div class="lp-coupon-action is-disabled">已抢完</div></div></article>
    </section>
    <h2 class="lp-section-title">精选靓机</h2>
    <section class="lp-image-ad is-single"><div class="lp-image-ad-item"><img class="lp-cover-image" src="../assets/landing/image-ad.png" alt="运动相机推荐"></div></section>
    <h2 class="lp-section-title">活动精选</h2>
    <section class="lp-products" aria-label="活动商品">
      <article class="lp-product"><div class="lp-product-image-wrap"><img class="lp-product-image" src="../assets/landing/product-osmo.jpg" alt="大疆口袋相机"></div><div class="lp-product-copy"><div class="lp-product-title">小胡神器，无限量 token plan</div><div class="lp-product-shop">团团享租</div><div class="lp-product-price"><small>¥</small>0.01<small>/天</small></div></div></article>
      <article class="lp-product"><div class="lp-product-image-wrap"><img class="lp-product-image" src="../assets/landing/product-vivo.jpg" alt="vivo X300 Ultra"></div><div class="lp-product-copy"><div class="lp-product-title">X300 Ultra</div><div class="lp-product-shop">团团享租</div><div class="lp-product-price"><small>¥</small>40<small>/天</small></div></div></article>
      <article class="lp-product"><div class="lp-product-image-wrap"><img class="lp-product-image" src="../assets/landing/product-fuji.png" alt="富士拍立得"></div><div class="lp-product-copy"><div class="lp-product-title">富士 instax wide400</div><div class="lp-product-shop">团团享租</div><div class="lp-product-price"><small>¥</small>2.5<small>/天</small></div></div></article>
      <article class="lp-product"><div class="lp-product-image-wrap"><img class="lp-product-image" src="../assets/landing/product-vivo.jpg" alt="vivo 长焦手机"></div><div class="lp-product-copy"><div class="lp-product-title">X300 Ultra 长焦手机</div><div class="lp-product-shop">团团享租</div><div class="lp-product-price"><small>¥</small>40<small>/天</small></div></div></article>
    </section>
    <div class="lp-action is-full"><div class="lp-action-button">返回首页</div></div>
    <div class="lp-spacer" aria-hidden="true"></div>
  </main>
</body>
</html>
